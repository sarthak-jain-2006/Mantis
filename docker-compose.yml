services:
  postgres:
    # Postgres 16 with the pgvector extension preinstalled (needed later for RAG).
    image: pgvector/pgvector:pg16
    container_name: mantis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Bound to localhost only, so the database is not exposed to your network.
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - mantis-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mantis-pgdata:
